name: Deploy (IPFS + Cloudflare Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/ipfs.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: perry-site
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Check configuration
        id: cfg
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$PINATA_JWT" ]; then echo "pinata=true"; else echo "pinata=false"; echo "::warning::PINATA_JWT not set - skipping IPFS pin" >&2; fi >> "$GITHUB_OUTPUT"
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "pages=true"; else echo "pages=false"; echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping Cloudflare Pages" >&2; fi >> "$GITHUB_OUTPUT"
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ZONE" ] && [ -n "$SITE_DOMAIN" ]; then echo "dnslink=true"; else echo "dnslink=false"; echo "::warning::CLOUDFLARE_ZONE_ID secret or SITE_DOMAIN variable not set - skipping DNSLink" >&2; fi >> "$GITHUB_OUTPUT"


      - name: Pin site/ to Pinata
        id: pin
        if: steps.cfg.outputs.pinata == 'true'
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          NAME="perry-site-${GITHUB_SHA::7}"
          ARGS=()
          while IFS= read -r -d '' f; do
            ARGS+=(-F "file=@${f};filename=${f}")
          done < <(find site -type f -print0 | sort -z)
          RESP=$(curl -sS --fail-with-body -X POST "https://api.pinata.cloud/pinning/pinFileToIPFS" \
            -H "Authorization: Bearer ${PINATA_JWT}" \
            "${ARGS[@]}" \
            -F 'pinataOptions={"cidVersion":1}' \
            -F "pinataMetadata={\"name\":\"${NAME}\"}")
          CID=$(echo "$RESP" | jq -r '.IpfsHash // empty')
          if [ -z "$CID" ]; then echo "$RESP"; echo "::error::Pinata did not return a CID"; exit 1; fi
          echo "CID: $CID"
          echo "cid=$CID" >> "$GITHUB_OUTPUT"


      - name: Deploy to Cloudflare Pages
        if: steps.cfg.outputs.pages == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 第一次執行時建立專案；已存在則略過
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data "{\"name\":\"${PAGES_PROJECT}\",\"production_branch\":\"main\"}" \
            | jq -c '{success, errors: [.errors[]?.message]}'
          npx --yes wrangler@3 pages deploy site --project-name="${PAGES_PROJECT}" --branch=main --commit-dirty=true


      - name: Update DNSLink
        if: steps.cfg.outputs.dnslink == 'true' && steps.pin.outputs.cid != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CID: ${{ steps.pin.outputs.cid }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records"
          NAME="_dnslink.${SITE_DOMAIN}"
          H=(-H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
          ID=$(curl -sS "${H[@]}" "${API}?type=TXT&name=${NAME}" | jq -r '.result[0].id // empty')
          BODY=$(jq -n --arg n "$NAME" --arg c "\"dnslink=/ipfs/${CID}\"" '{type:"TXT",name:$n,content:$c,ttl:300}')
          if [ -n "$ID" ]; then
            RESP=$(curl -sS -X PUT "${H[@]}" "${API}/${ID}" --data "$BODY")
          else
            RESP=$(curl -sS -X POST "${H[@]}" "${API}" --data "$BODY")
          fi
          if ! echo "$RESP" | jq -e '.success == true' >/dev/null; then
            echo "$RESP"; echo "::error::DNSLink update failed"; exit 1
          fi
          echo "DNSLink: ${NAME} -> /ipfs/${CID}"


      - name: Write CID.md & summary
        if: steps.pin.outputs.cid != ''
        env:
          CID: ${{ steps.pin.outputs.cid }}
        run: |
          {
            echo "# Latest deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            if [ -n "$SITE_DOMAIN" ]; then echo "| **Site** | https://${SITE_DOMAIN} |"; fi
            echo "| **CID** | \`${CID}\` |"
            echo "| **Commit** | \`${GITHUB_SHA::7}\` |"
            echo "| **dweb.link** | https://${CID}.ipfs.dweb.link/ |"
            echo "| **Pinata** | https://gateway.pinata.cloud/ipfs/${CID}/ |"
            echo "| **ipfs.io** | https://ipfs.io/ipfs/${CID}/ |"
          } > CID.md
          cat CID.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit CID.md
        if: steps.pin.outputs.cid != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CID.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): CID ${{ steps.pin.outputs.cid }} [skip ci]"
          # 遠端可能已有新 commit（例如另一次執行剛寫入 CID.md），先 rebase 再推，最多重試 3 次
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; git pull --no-rebase -X ours origin main; }
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected, retry $i"; sleep $((i*3))
          done
          echo "::error::Could not push CID.md after 3 attempts"; exit 1
